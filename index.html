<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"></script>
    <title>Butterfly</title>
    <style>
        :root {
            --fg: #ffffff;
            --bg: #0b0b0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 16px/1.5 'Monaco', serif;
            color: var(--fg);
            background: var(--bg);
        }

        /* Fullscreen hero */
        header {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        header video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(4px) saturate(80%) brightness(75%);
            opacity: 0;
            transition: opacity 600ms ease;
        }

        header video.ready {
            opacity: 1;
        }
        /* Hero content */
        header .hero {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            letter-spacing: .02em;
            margin-top: 1rem;
        }

        header .hero img {
            margin-top: 1rem;
            width: 50%;
        }

        a.cta {
            display: inline-block;
            padding: 1rem;
            border: 1px solid #fff;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            position: relative;
        }
    </style>
</head>

<body>

    <header>
        <video muted playsinline autoplay loop oncanplay="this.classList.add('ready')" aria-hidden="true">
            <source src="OCEAN.mp4" type="video/mp4">
        </video>
        <main>
        <div class="hero">
            <img src="me.JPG" alt="Portrait of Keya Patel">
            <h1>Keya Patel</h1>
            <a class="cta" href="portfolio.html">Portfolio</a>
        </div>
        
    </header>
        <footer>
            <p>©2025 Keya Patel </p>
        </footer>
    </main>
</body>
</html>
